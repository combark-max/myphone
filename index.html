<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Clean Files</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  overflow:hidden;
  color:white;
}

/* 블러 카드 */
.card {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.1);
  margin:15px;
  padding:20px;
  border-radius:20px;
  transition:0.3s;
}

.card:hover { transform:scale(1.02); }

/* 화면 */
.screen {
  position:absolute;
  width:100%;
  height:100%;
  transition:0.4s;
}
.hidden { transform:translateX(100%); opacity:0; }

/* 상단 */
.appbar {
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

/* FAB */
.fab {
  position:fixed;
  bottom:90px;
  right:20px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:linear-gradient(45deg,#00f2fe,#4facfe);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
  transition:0.2s;
}
.fab:active { transform:scale(0.85); }

/* 하단 */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.2);
}
.nav div {
  flex:1;
  text-align:center;
  padding:12px;
}
.active { color:#00f2fe; }

/* 이미지 */
.preview img {
  width:80px;
  border-radius:10px;
  margin:5px;
}

/* 잠금 */
.lock {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
}
.pin { font-size:30px; letter-spacing:10px; }

/* 버튼 */
button {
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- 🔐 잠금 -->
<div id="lock" class="lock">
  <h2>🔐 Unlock</h2>
  <div id="pin" class="pin">••••</div>
  <div>
    <button onclick="press(1)">1</button>
    <button onclick="press(2)">2</button>
    <button onclick="press(3)">3</button><br>
    <button onclick="press(4)">4</button>
    <button onclick="press(5)">5</button>
    <button onclick="press(6)">6</button><br>
    <button onclick="press(7)">7</button>
    <button onclick="press(8)">8</button>
    <button onclick="press(9)">9</button><br>
    <button onclick="press(0)">0</button>
  </div>
</div>

<!-- 홈 -->
<div id="home" class="screen hidden">
  <div class="appbar">My Clean Files</div>

  <div class="card">
    <h3>📊 저장공간</h3>
    <p id="storage">분석 전</p>
  </div>

  <div class="card">
    <h3>🤖 AI 분석</h3>
    <p id="ai">파일 선택 필요</p>
  </div>
</div>

<!-- 파일 -->
<div id="files" class="screen hidden">
  <div class="appbar">파일 분석</div>

  <div class="card">
    <input type="file" multiple onchange="analyze(event)">
    <div class="preview" id="preview"></div>
  </div>
</div>

<!-- FAB -->
<div class="fab" onclick="autoClean()">✨</div>

<!-- 네비 -->
<div class="nav">
  <div onclick="show('home',this)">홈</div>
  <div onclick="show('files',this)">파일</div>
</div>

<script>
let pin="", correct="1234";

// 잠금
function press(n){
  pin+=n;
  if(pin.length==4){
    if(pin==correct){
      document.getElementById("lock").style.display="none";
      show('home');
    } else {
      alert("틀림");
      pin="";
    }
  }
}

// 화면 전환
function show(id, el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');

  if(el){
    document.querySelectorAll('.nav div').forEach(d=>d.classList.remove('active'));
    el.classList.add('active');
  }
}

// 파일 분석 + AI
let fileData=[];
function analyze(e){
  let files=e.target.files;
  fileData=[...files];

  let preview=document.getElementById("preview");
  preview.innerHTML="";

  let names={}, dup=0, size=0;

  fileData.forEach(f=>{
    size+=f.size;

    if(f.type.startsWith("image")){
      let img=document.createElement("img");
      img.src=URL.createObjectURL(f);
      preview.appendChild(img);
    }

    if(names[f.name]) dup++;
    names[f.name]=true;
  });

  document.getElementById("storage").innerText =
    (size/1024/1024).toFixed(2)+" MB 사용";

  document.getElementById("ai").innerText =
    "중복 "+dup+"개 / 총 "+files.length+"개";
}

// 자동 정리
function autoClean(){
  let removed=0;
  let seen={};

  fileData = fileData.filter(f=>{
    if(seen[f.name]){
      removed++;
      return false;
    }
    seen[f.name]=true;
    return true;
  });

  alert("✨ 자동 정리 완료: "+removed+"개 삭제");
}
</script>

</body>
</html>
