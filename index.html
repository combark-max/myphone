<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Clean Files</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body { margin:0; font-family:Roboto; background:#f1f3f4; overflow:hidden;}
.screen { position:absolute; width:100%; height:100%; transition:0.4s;}
.hidden { transform:translateX(100%); opacity:0;}
.appbar { background:#6200ee; color:white; padding:16px; font-size:20px;}
.card { background:white; margin:12px; padding:16px; border-radius:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.nav { position:fixed; bottom:0; width:100%; display:flex; background:white;}
.nav div { flex:1; text-align:center; padding:10px; cursor:pointer;}
.active { color:#6200ee;}
.fab {
  position:fixed; bottom:80px; right:20px;
  width:60px; height:60px; border-radius:50%;
  background:#03dac5; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.3); cursor:pointer;
  transition:0.2s;
}
.fab:active { transform:scale(0.9);}
.preview img { width:70px; margin:5px; border-radius:8px;}
.lock { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; background:#6200ee; color:white;}
.pin { font-size:30px; margin:10px;}
</style>
</head>

<body>

<!-- 🔐 잠금 화면 -->
<div id="lockScreen" class="lock">
  <h2>🔐 비밀번호 입력</h2>
  <div id="pinDisplay" class="pin">••••</div>
  <div>
    <button onclick="press(1)">1</button>
    <button onclick="press(2)">2</button>
    <button onclick="press(3)">3</button><br>
    <button onclick="press(4)">4</button>
    <button onclick="press(5)">5</button>
    <button onclick="press(6)">6</button><br>
    <button onclick="press(7)">7</button>
    <button onclick="press(8)">8</button>
    <button onclick="press(9)">9</button><br>
    <button onclick="press(0)">0</button>
  </div>
</div>

<!-- 홈 -->
<div id="home" class="screen hidden">
  <div class="appbar">My Clean Files</div>

  <div class="card">
    <h3>📊 저장공간</h3>
    <p>파일 업로드 후 분석됩니다</p>
  </div>

  <div class="card">
    <h3>🤖 AI 분석</h3>
    <p id="aiResult">파일을 선택하세요</p>
  </div>
</div>

<!-- 파일 -->
<div id="files" class="screen hidden">
  <div class="appbar">파일 분석</div>

  <div class="card">
    <input type="file" id="fileInput" multiple onchange="analyzeFiles()">
    <div class="preview" id="preview"></div>
  </div>
</div>

<!-- 설정 -->
<div id="settings" class="screen hidden">
  <div class="appbar">설정</div>
  <div class="card">🔐 보안 ON</div>
</div>

<!-- FAB -->
<div class="fab" onclick="alert('AI 정리 실행')">
  <span class="material-icons">cleaning_services</span>
</div>

<!-- 네비 -->
<div class="nav">
  <div onclick="show('home', this)">홈</div>
  <div onclick="show('files', this)">파일</div>
  <div onclick="show('settings', this)">설정</div>
</div>

<script>
let pin="";
let savedPin="1234";

function press(num){
  pin += num;
  if(pin.length===4){
    if(pin===savedPin){
      document.getElementById("lockScreen").style.display="none";
      show('home');
    } else {
      alert("비밀번호 틀림");
      pin="";
    }
  }
}

// 화면 전환
function show(id, el){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');

  if(el){
    document.querySelectorAll('.nav div').forEach(d=>d.classList.remove('active'));
    el.classList.add('active');
  }
}

// 파일 분석
function analyzeFiles(){
  let files = document.getElementById('fileInput').files;
  let preview = document.getElementById('preview');
  preview.innerHTML="";

  let names = {};
  let duplicate = 0;

  for(let f of files){
    if(f.type.startsWith("image")){
      let img = document.createElement("img");
      img.src = URL.createObjectURL(f);
      preview.appendChild(img);
    }

    if(names[f.name]) duplicate++;
    else names[f.name]=true;
  }

  document.getElementById("aiResult").innerText =
    "총 파일: "+files.length+" / 중복: "+duplicate;
}
</script>

</body>
</html>
